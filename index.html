<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FlexyTimer</title>
</head>
<body>

    <header>
    <h1>FlexyTimer</h1>
    </header>    

    <main>
        <section id="display-section">

            <h2 id="timer-display">00:00:00</h2>

        
            <p id="status-message">Ready</p>
        </section>

        <section id="settings-section">
            <h2>Timer Settings</h2>

               <label for="time-input">Work Time (seconds)</label>
        <input type="number" id="time-input" min="1">

        <label for="rest-input">Rest Time (seconds)</label>
        <input type="number" id="rest-input" min="0">

        <label for="rounds-input">Rounds</label>
        <input type="number" id="rounds-input" min="1">
        </section>

        <section id="controls-section">

            <button id="start-btn">Start</button>

            <button id="pause-btn">Pause</button>

            <button id="reset-btn">Reset</button>
        </section>



       
    </main>


<script src="script.js"></script>
</body>
</html>
