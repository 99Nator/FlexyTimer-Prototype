<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FlexyTimer</title>
</head>
<body>

    <header>
    <h1>FlexyTimer</h1>
    </header>    

    <main>
        <section id="timer-container">

            <h2 id="timer-display">00:00</h2>
        </section>

        <section id="controls">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </section>

        <section id="settings">
            
            <h3>Interval Settings</h3>

            <p>Work Time</p>

            <p>Rest Time</p>

            <p>Rounds</p>
        </section>
    </main>


<script src="script.js"></script>
</body>
</html>
